name: Build Windows Installer (NSIS with Full Portable Python)

on:
  release:
    types: [created]

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: 3.15.2

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller requests PyQt6 beautifulsoup4 pillow packaging

      # -------------------------------
      # Build Windows EXEs
      # -------------------------------

      - name: Build GUI EXE
        shell: pwsh
        run: |
          cd src
          pyinstaller --clean --onedir --icon=../icon.ico gui.py -n hi10_image_downloader

      # -------------------------------
      # Prepare NSIS installer folder (include _internal)
      # -------------------------------
      - name: Prepare NSIS installer folder
        shell: pwsh
        run: |
          $STAGE = "hi10_image_downloader_windows"
          $DIST_FOLDER = "src\dist\hi10_image_downloader"

          # Create staging folder
          New-Item -ItemType Directory -Force -Path $STAGE | Out-Null

          # Copy portable build contents (including _internal)
          Copy-Item -Path "$DIST_FOLDER\*" -Destination "$STAGE\" -Recurse -Force

          # Copy resources and guides
          Copy-Item -Path "icon.ico" -Destination "$STAGE\" -Force

          Write-Host "Prepared NSIS installer folder: $STAGE"

      # -------------------------------
      # Install NSIS
      # -------------------------------
      - name: Install NSIS
        run: choco install nsis -y --no-progress

      # -------------------------------
      # Build NSIS Installer
      # -------------------------------
      - name: Build NSIS Installer
        shell: pwsh
        run: |
          & "C:\Program Files (x86)\NSIS\makensis.exe" /DVERSION=${{ github.ref_name }} installer/hi10_image_downloader_installer.nsi

      - name: Verify installer
        shell: pwsh
        run: dir installer\hi10_image_downloader_setup_${{ github.ref_name }}.exe

      - name: Upload Installer
        uses: softprops/action-gh-release@v3
        with:
          files: installer/hi10_image_downloader_setup_${{ github.ref_name }}.exe
          overwrite_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GH_PAT }}
