name: Build hi10_image_downloader Release ZIPs v2

on:
  release:
    types: [created]

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: 3.15.2

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller requests PyQt6 beautifulsoup4 pillow packaging

      - name: Build GUI with PyInstaller
        shell: pwsh
        run: |
          cd src
          pyinstaller --clean --onedir --icon=../icon.ico gui.py -n hi10_image_downloader

      - name: Package portable ZIP
        shell: pwsh
        run: |
          $DIST_FOLDER = "src\dist\hi10_image_downloader"
          $ZIP_NAME = "Hi10_image_downloader_windows_${env:GITHUB_REF_NAME}.zip"

          # Include runtime GUI icon
          Copy-Item "icon.ico" "$DIST_FOLDER\"

          Compress-Archive -Path "$DIST_FOLDER\*" -DestinationPath $ZIP_NAME -Force

          Write-Host "Created $ZIP_NAME"

      - name: Upload ZIP to GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: hi10_image_downloader_windows_${{ github.ref_name }}.zip

  build-macos:
    runs-on: macos-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: 3.15.2

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller requests PyQt6 beautifulsoup4 pillow packaging

      - name: Build GUI with PyInstaller
        shell: bash
        run: |
          cd src
          pyinstaller --clean --onedir gui.py -n hi10_image_downloader

      - name: Prepare release folder
        shell: bash
        run: |
          cp -r src/dist/hi10_image_downloader/* hi10_image_downloader_macos/
          cp src/gui.py hi10_image_downloader_macos/
          cp icon_linux.png hi10_image_downloader_macos/
          cp requirements.txt hi10_image_downloader_macos/

      - name: Create ZIP
        shell: bash
        run: |
          zip -r hi10_image_downloader_macos_${{ github.ref_name }}.zip hi10_image_downloader_macos

      - name: Upload ZIP to GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: hi10_image_downloader_macos_${{ github.ref_name }}.zip

  build-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: 3.15.2

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller requests PyQt6 beautifulsoup4 pillow packaging

      - name: Build GUI with PyInstaller
        shell: bash
        run: |
          cd src
          pyinstaller --clean --onedir gui.py -n hi10_image_downloader

      - name: Prepare release folder
        shell: bash
        run: |
          cp -r src/dist/hi10_image_downloader/* hi10_image_downloader_linux/
          cp src/gui.py hi10_image_downloader_linux/
          cp icon_linux.png hi10_image_downloader_linux/
          cp requirements.txt hi10_image_downloader_linux/

      - name: Create ZIP
        shell: bash
        run: |
          zip -r hi10_image_downloader_linux_${{ github.ref_name }}.zip hi10_image_downloader_linux

      - name: Upload ZIP to GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: hi10_image_downloader_linux_${{ github.ref_name }}.zip
