name: Build Portable Python App

on:
  release:
    types: [created]

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: 3.15.2

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller requests PyQt6 beautifulsoup4 pillow packaging

      # -------------------------------
      # Build Windows EXE
      # -------------------------------
      - name: Build Python application
        shell: pwsh
        run: |
          cd src
          pyinstaller --clean --onedir --icon=../icon.ico gui.py -n hi10_image_downloader_portable

      # -------------------------------
      # Package portable ZIP
      # -------------------------------
      - name: Package portable ZIP
        shell: pwsh
        run: |
          $DIST_FOLDER = "src\dist\hi10_image_downloader_portable"
          $ZIP_NAME = "Hi10_image_downloader_windows_${env:GITHUB_REF_NAME}_portable.zip"

          # Include runtime GUI icon
          Copy-Item "icon.ico" "$DIST_FOLDER\"

          Compress-Archive -Path "$DIST_FOLDER\*" -DestinationPath $ZIP_NAME -Force

          Write-Host "Created $ZIP_NAME"

      # -------------------------------
      # Upload release asset
      # -------------------------------
      - name: Upload release asset
        uses: softprops/action-gh-release@v3
        with:
          files: Hi10_image_downloader_windows_${{ github.ref_name }}_portable.zip
