name: Build Portable Python App

on:
  release:
    types: [created]

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: 3.15.2

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller PyQt6 beautifulsoup4 pillow packaging

      # -------------------------------
      # Build Windows EXEs
      # -------------------------------
      - name: Build Python script EXE
        shell: pwsh
        run: |
          cd src
          pyinstaller --clean --onefile --icon=../icon.ico gui.py

      # -------------------------------
      # Prepare portable folder
      # -------------------------------
      - name: Prepare portable folder
        shell: pwsh
        run: |
          $STAGE = "src\dist\hi10_image_downloader_portable"

          # CLI
          Copy-Item -Recurse src\dist\python_postar\* "$STAGE\"

          # Other files
          Copy-Item icon.ico "$STAGE\"

      - name: Package portable ZIP
        shell: pwsh
        run: |
          $DIST_FOLDER = "src\dist\hi10_image_downloader_portable"
          $ZIP_NAME = "Hi10_image_downloader_windows_${env:GITHUB_REF_NAME}_portable.zip"
          Compress-Archive -Path "$DIST_FOLDER\*" -DestinationPath $ZIP_NAME -Force
          Write-Host "Created $ZIP_NAME"

      - name: Upload release asset
        uses: softprops/action-gh-release@v3
        with:
          files: Hi10_image_downloader_windows_${{ github.ref_name }}_portable.zip
